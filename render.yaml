# Free SQLite school demo: database resets when Render discards local storage.
# This file belongs at the repository root when platform/ is the repository root.
services:
  - type: web
    name: branchflow
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    envVars:
      - key: APP_NAME
        value: BranchFlow
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUST_PROXIES
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/storage/app/branchflow.sqlite
      - key: DEPLOY_EPHEMERAL_SQLITE
        value: "true"
      - key: PGCONNECT_TIMEOUT
        value: "10"
      - key: DB_TIMEZONE
        value: Africa/Lagos
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_QUEUE_RETRY_AFTER
        value: "180"
      - key: OWNER_NAME
        value: Business Owner
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: DEPLOY_SEED_DEMO
        value: "true"
      - key: DEPLOY_DEMO_STAFF_PASSWORD
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
