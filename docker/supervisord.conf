[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/branchflow-supervisord.pid

[program:web]
command=/usr/local/bin/apache2-foreground
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:queue]
command=php artisan queue:work ingestion --sleep=5 --tries=3 --timeout=120 --memory=128 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=150
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
